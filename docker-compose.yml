services:
  grabr:
    build: .
    image: grabr:dev
    ports:
      - "${GRABR_PORT:-8080}:${GRABR_PORT:-8080}"
    environment:
      GRABR_ADMIN_USER: ${GRABR_ADMIN_USER:?set GRABR_ADMIN_USER in .env}
      GRABR_ADMIN_PASS: ${GRABR_ADMIN_PASS:?set GRABR_ADMIN_PASS in .env}
      GRABR_PORT: ${GRABR_PORT:-8080}
      GRABR_DATA_DIR: /data
    volumes:
      - grabr-data:/data
    restart: unless-stopped

volumes:
  grabr-data:
